<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasYno Royal - Inscription</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* AJOUT CLÉ : Empile les éléments verticalement */
            justify-content: center; /* Centre verticalement si possible */
            align-items: center; /* Centre horizontalement (l'axe transversal) */
            margin: 0;
        }

        header {
            background: rgba(0, 0, 0, 0.5);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            /* Header fixe */
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            height: 80px;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-decoration: none; /* Important pour les liens <a> */
            display: inline-block;
        }

        /* Bouton Login (Style contour ici car inactif) */
        .btn-login {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
        }

        .btn-login:hover {
            background: #ffd700;
            color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        /* Bouton Signup (Style plein ici car page active) */
        .btn-signup {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.6);
        }

        /* Conteneur du formulaire */
        .signup-container {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 3rem;
            border-radius: 20px;
            border: 2px solid #ffd700;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            
            /* CENTRAGE */
            margin: auto; 
            margin-top: 40px; /* Un peu d'air par rapport au header si l'écran est petit */
            margin-bottom: 40px;
            margin: auto; 
        }

        .signup-container h2 {
            color: #ffd700;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-label {
            color: #ccc;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(255, 215, 0, 0.25);
        }

        .btn-submit {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.6);
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: bold;
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.9);
            color: white;
            border: 1px solid #dc3545;
        }

        .alert-success {
            background-color: rgba(40, 167, 69, 0.9);
            color: white;
            border: 1px solid #28a745;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.5);
            margin-top: auto; /* Pousse le footer tout en bas */
            color: #888;
            width: 100%;
        }

    </style>
</head>

<body>
    <header>
        <div class="logo">♠ CASYNO ROYAL ♥</div>
        <div class="auth-buttons">
            <button class="btn btn-login" onclick="window.location.href='/login'">
                Connexion
            </button>
            <button class="btn btn-signup" onclick="window.location.href='/signup'" disabled>Inscription</button>
        </div>
    </header>

    <div class="signup-container">
        <h2>Créer un compte</h2>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <p th:text="${error}"></p>
        </div>
        <div th:if="${message}" class="alert alert-success" role="alert">
            <p th:text="${message}"></p>
        </div>

        <form th:action="@{/signup}" th:object="${appUser}" method="post">
            <div class="mb-3"> <label for="name" class="form-label">Nom</label>
                <input type="text" id="name" name="name" class="form-control" th:field="*{name}" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" class="form-control" th:field="*{username}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" th:field="*{password}" required>
            </div>
            
            <button type="submit" class="btn btn-submit">S'inscrire</button>
        </form>

        <p class="text-center mt-3" style="color: #ccc;">Déjà un compte ? <a href="/login" style="color: #ffd700; text-decoration: none;">Connectez-vous ici</a></p>
    </div>

    <footer>
        <p>&copy; 2025 CasYno Royal. Jouez de manière responsable. +18 ans.</p>
        <p>Avertissement : Ce site est une démonstration. Les jeux d'argent peuvent créer une dépendance.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
