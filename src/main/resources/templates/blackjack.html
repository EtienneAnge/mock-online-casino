<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CasYno Royale - Blackjack</title>
    <style>
        body { font-family: sans-serif; background-color: #2e7d32; color: white; text-align: center; }
        .game-area { margin: 20px auto; max-width: 800px; padding: 20px; background-color: rgba(0,0,0,0.2); border-radius: 10px; }
        .hand { display: flex; justify-content: center; margin-bottom: 10px; }
        .card-img { width: 100px; height: 145px; margin: 5px; border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .score { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
        .message-box { background-color: #fdd835; color: black; padding: 15px; border-radius: 5px; margin: 20px 0; font-size: 1.2em; }
        .actions button { padding: 10px 20px; font-size: 1em; margin: 5px; cursor: pointer; }
        .btn-hit { background-color: #4caf50; color: white; border: none; }
        .btn-stand { background-color: #f44336; color: white; border: none; }
        .btn-new { background-color: #2196f3; color: white; border: none; }
    </style>
</head>
<body>

    <h1>Blackjack Table</h1>

    <div class="message-box" th:text="${bjService.gameMessage}">Message du jeu</div>

    <div class="game-area">
        <h2>Croupier</h2>
        <div class="hand">
            <div th:each="card, iterStat : ${bjService.dealerHand.cards}">
                <img th:if="${bjService.isGameOngoing() and iterStat.index == 1}"
                     th:src="@{img/card/back.png}"
                     class="card-img" alt="Carte cachée">

                <img th:unless="${bjService.isGameOngoing() and iterStat.index == 1}"
                     th:src="@{'/img/card/' + ${card.imagePath}}"
                     class="card-img" th:alt="${card.toString()}">
            </div>
        </div>
        <div class="score" th:if="${!bjService.isGameOngoing()}">
            Score: <span th:text="${bjService.dealerHand.calculateScore()}">0</span>
        </div>


        <hr style="border-color: rgba(255,255,255,0.3);">


        <h2>Votre Main</h2>
        <div class="hand">
            <img th:each="card : ${bjService.playerHand.cards}"
                 th:src="@{'/img/card/' + ${card.imagePath}}"
                 class="card-img" th:alt="${card.toString()}">
        </div>
        <div class="score">
            Score: <span th:text="${bjService.playerHand.calculateScore()}">0</span>
        </div>


        <div class="actions">
            <form th:if="${bjService.isGameOngoing()}" action="#" th:action="@{/blackjack/hit}" method="post" style="display:inline;">
                <button type="submit" class="btn-hit">Tirer (Hit)</button>
            </form>
            <form th:if="${bjService.isGameOngoing()}" action="#" th:action="@{/blackjack/stand}" method="post" style="display:inline;">
                <button type="submit" class="btn-stand">Rester (Stand)</button>
            </form>

            <form th:if="${!bjService.isGameOngoing()}" action="#" th:action="@{/blackjack/newgame}" method="post">
                <button type="submit" class="btn-new">Nouvelle Partie</button>
            </form>
        </div>

    </div>
    <p><a href="/" style="color:white;">Retour à l'accueil</a></p>

</body>
</html>
