<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blackjack Multiplayer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1b5e20; color: white; text-align: center; margin: 0; padding: 20px; }
        .top-bar { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        
        /* Table de jeu */
        .table-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        /* Zone Croupier */
        .dealer-area { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; min-width: 300px; border: 2px solid #d4af37; }
        
        /* Zone Joueurs (Flex row pour les voir côte à côte) */
        .players-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }
        
        .player-seat { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; min-width: 200px; transition: 0.3s; position: relative; border: 2px solid transparent;}
        .player-seat.my-seat { border-color: #ffca28; background: rgba(255, 202, 40, 0.1); }
        .player-seat.active-turn { box-shadow: 0 0 15px #42a5f5; border-color: #42a5f5; transform: scale(1.05); }

        .cards-container { display: flex; justify-content: center; gap: 5px; height: 100px; margin: 10px 0; }
        .card-img { height: 90px; border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }

        .timer-display { font-size: 2em; font-weight: bold; color: #ffca28; margin: 10px; }
        
        /* Contrôles */
        .controls-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px; border-radius: 20px; z-index: 100; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; font-size: 1em; }
        .btn-hit { background: #4caf50; color: white; }
        .btn-stand { background: #f44336; color: white; }
        .btn-bet { background: #ffca28; color: black; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>Joueur : <strong th:text="${user.name}"></strong></div>
        <div> Code de la partie: <span th:text="${@roomCodeService.generateCode(room.idRoom)}">0</span></div>
        <div>Solde : <strong id="balanceDisplay" th:text="${user.balance}"></strong> €</div>
        <button class="btn-exit" onclick="exitRoom()">Quitter la table</button>
    </div>

    <div id="gameStatus" style="font-size: 1.2em; margin-bottom: 5px;">En attente...</div>
    <div id="timerDisplay" class="timer-display">--</div>

    <div class="table-container">
        <div class="dealer-area">
            <h3>Croupier <span id="dealerScore"></span></h3>
            <div id="dealerCards" class="cards-container"></div>
        </div>

        <div id="playersContainer" class="players-row">
            </div>
    </div>

    <div class="controls-area" id="controlsBar">
        </div>

    <script th:inline="javascript">
        const roomId = [[${room.idRoom}]];
        let refreshInterval = null;
        let lastStatus = "";

        // Démarrage de la boucle de rafraichissement (toutes les 1s)
        function startPolling() {
            refreshData(); // Appel immédiat
            refreshInterval = setInterval(refreshData, 1000);
        }

        async function refreshData() {
            try {
                const response = await fetch('/api/game/blackjack/refreshData', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(roomId)
                });
                const data = await response.json();
                renderGame(data);
            } catch (e) { console.error("Erreur polling", e); }
        }

        function renderGame(data) {
            // 1. Infos Globales
            document.getElementById('balanceDisplay').textContent = data.userBalance;
            document.getElementById('gameStatus').textContent = "État : " + data.status;
            
            // Timer
            const timerDiv = document.getElementById('timerDisplay');
            if (data.status === 'BETTING') {
                timerDiv.textContent = data.timer + " s";
                timerDiv.style.color = data.timer < 5 ? 'red' : '#ffca28';
            } else {
                timerDiv.textContent = ""; 
            }

            // 2. Croupier
            const dealerDiv = document.getElementById('dealerCards');
            dealerDiv.innerHTML = '';
            data.dealer.cards.forEach(c => dealerDiv.appendChild(createCardImg(c)));
            document.getElementById('dealerScore').textContent = "(" + data.dealer.score + ")";

            // 3. Joueurs
            const playersDiv = document.getElementById('playersContainer');
            playersDiv.innerHTML = '';
            
            // On vérifie si NOUS avons déjà misé pour afficher l'input de mise
            let iHaveBet = false;

            data.players.forEach(p => {
                if (p.isMe) iHaveBet = true;
                
                const seat = document.createElement('div');
                seat.className = `player-seat ${p.isMe ? 'my-seat' : ''} ${p.isTurn ? 'active-turn' : ''}`;
                
                let html = `<div><strong>${p.name}</strong></div>`;
                html += `<div style="font-size:0.8em">Mise: ${p.bet}€</div>`;
                html += `<div class="cards-container">`;
                p.cards.forEach(c => {
                    // Construction chemin image (suppose Card.imagePath ou rank_suit)
                    const src = '/img/card/' + (c.imagePath ? c.imagePath : (c.rank + '_' + c.suit + '.png'));
                    html += `<img src="${src}" class="card-img">`;
                });
                html += `</div>`;
                html += `<div>Score: ${p.score}</div>`;
                html += `<div style="font-weight:bold; color:${getStatusColor(p.status)}">${p.status}</div>`;
                
                seat.innerHTML = html;
                playersDiv.appendChild(seat);
            });

            // 4. Contrôles (Boutons)
            renderControls(data, iHaveBet);
        }

        function renderControls(data, iHaveBet) {
            const controls = document.getElementById('controlsBar');

            // --- CAS 1 : PHASE DE MISE ---
            if (data.status === 'BETTING') {
                if (!iHaveBet && data.timer > 0) {
                    // LA CORRECTION EST ICI : 
                    // On vérifie si l'input "betInput" existe déjà.
                    // S'il n'existe PAS, on le crée. S'il existe, on ne touche à rien.
                    if (!document.getElementById('betInput')) {
                        controls.innerHTML = `
                            <input type="number" id="betInput" value="10" min="10" style="width:60px; padding:5px;">
                            <button class="btn-bet" onclick="placeBet()">MISER</button>
                        `;
                    }
                } else {
                    // Si on a déjà misé ou que le temps est fini, on affiche le message d'attente
                    // Ici on peut écraser le HTML car on n'a plus besoin de l'input
                    controls.innerHTML = `<span style="color:white">En attente des autres joueurs...</span>`;
                }
            } 
            
            // --- CAS 2 : TOUR DE JEU ---
            else if (data.status === 'PLAYER_TURN') {
                // Ici on écrase le HTML à chaque fois car ce sont des boutons, pas de texte à saisir
                // (Optimisation possible : vérifier si les boutons existent déjà, mais moins critique)
                if (data.isMyTurn) {
                    // On vérifie juste si on n'a pas déjà les boutons pour éviter le clignotement
                    if (!document.querySelector('.btn-hit')) {
                        controls.innerHTML = `
                            <button class="btn-hit" onclick="actionHit()">TIRER</button>
                            <button class="btn-stand" onclick="actionStand()">RESTER</button>
                        `;
                    }
                } else {
                    controls.innerHTML = `<span style="color:#aaa">Tour d'un autre joueur...</span>`;
                }
            }
            
            // --- CAS 3 : FIN DE MANCHE ---
            else if (data.status === 'FINISHED') {
                 controls.innerHTML = `<span style="color:#ffca28; font-weight:bold">Manche terminée. Prochaine dans quelques secondes...</span>`;
            }
        }

        function createCardImg(card) {
            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = '/img/card/' + (card.imagePath ? card.imagePath : (card.rank + '_' + card.suit + '.png'));
            return img;
        }

        function getStatusColor(status) {
            if(status.includes('WON')) return '#69f0ae';
            if(status === 'LOST' || status === 'BUSTED') return '#ff5252';
            if(status === 'PUSH') return '#ffca28';
            return 'white';
        }

        // Actions
        async function placeBet() {
            const amount = document.getElementById('betInput').value;
            await fetch('/api/game/blackjack/bet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({idRoom: roomId, amount: amount})
            });
            refreshData();
        }

        async function actionHit() {
            await fetch('/api/game/blackjack/hit', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(roomId)
            });
            refreshData();
        }

        async function actionStand() {
            await fetch('/api/game/blackjack/stand', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(roomId)
            });
            refreshData();
        }
        
        async function exitRoom() {
            try {
                // On envoie l'ID de la salle au serveur pour se désinscrire
                await fetch('/api/game/blackjack/exit', {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'}, // On envoie une simple chaîne
                    body: roomId.toString() 
                });
                
                // REDIRECTION VERS L'ACCUEIL
                window.location.href = "/";
                
            } catch (e) {
                console.error("Erreur lors de la sortie:", e);
                // On redirige quand même pour ne pas bloquer l'utilisateur
                window.location.href = "/";
            }
        }

        // Lancer le jeu
        startPolling();

    </script>
</body>
</html>
