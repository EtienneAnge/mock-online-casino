<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasYno Royal - Mon Compte</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(0, 0, 0, 0.5);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            text-decoration: none;
        }

        .btn-logout {
            background: transparent;
            border: 2px solid #ff4e4e;
            color: #ff4e4e;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ff4e4e;
            color: white;
        }

        .btn-home {
            color: #ccc;
            text-decoration: none;
            margin-right: 20px;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .btn-home:hover {
            color: #ffd700;
        }

        .account-container {
            max-width: 900px;
            margin: 50px auto;
            width: 90%;
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 2rem;
        }

        .nav-tabs {
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 2rem;
        }

        .nav-tabs .nav-link {
            color: #ccc;
            border: none;
            font-size: 1.1rem;
            background: transparent;
        }

        .nav-tabs .nav-link:hover {
            color: #fff;
            border-color: transparent;
        }

        .nav-tabs .nav-link.active {
            color: #ffd700 !important;
            background-color: transparent !important;
            border: none;
            border-bottom: 3px solid #ffd700;
            font-weight: bold;
        }

        .info-group {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .info-label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 500;
        }

        /* Bouton Crayon (Edit) */
        .btn-edit {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #ffd700;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-edit:hover {
            background: #ffd700;
            color: #1a1a2e;
            transform: scale(1.1);
        }

        .balance-value {
            color: #28a745;
            font-weight: bold;
        }

        .btn-add-credit {
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0));
            border: 1px solid #ffd700;
            color: #ffd700;

            border-radius: 25px;
            padding: 0.5rem 1.5rem;

            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;

            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-add-credit:hover {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            transform: translateY(-2px);
            border-color: transparent;
        }

        .btn-add-credit:active {
            transform: translateY(0);
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        .modal-content {
            background: #16213e;
            color: white;
            border: 1px solid #ffd700;
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-close {
            filter: invert(1);
        }


        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.5);
            margin-top: auto;
            color: #888;
        }

        .alert-success {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }
    </style>
</head>



<body>

    <header>
        <a href="/" class="logo">♠ CASYNO ROYAL ♥</a>
        <div class="d-flex align-items-center">
            <a href="/" class="btn-home">Accueil</a>
            <button type="submit" class="btn btn-logout" onclick="window.location.href='/logout'">
                Déconnexion
            </button>
        </div>
    </header>

    <div class="account-container">
        <h2>Espace Personnel</h2>

        <div th:if="${message}" class="alert alert-success text-center" role="alert">
            <span th:text="${message}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger text-center" role="alert">
            <span th:text="${error}"></span>
        </div>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile"
                    type="button" role="tab">👤 Mes Informations</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button"
                    role="tab">📈 Mes Statistiques</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">

            <!-- ONGLET 1 : INFORMATIONS -->
            <div class="tab-pane fade show active" id="profile" role="tabpanel">

                <div class="info-group">
                    <div class="info-label">Prenom</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="info-value" th:text="${session.user.name}"></div>

                        <button class="btn-edit" data-bs-toggle="modal" data-bs-target="#genericEditModal"
                            data-title="Modifier mon nom" data-label="Nouveau nom" data-field-name="newName"
                            th:data-current-value="${session.user.name}" data-url="/myaccount/update-name">
                            ✏️
                        </button>
                    </div>
                </div>

                <div class="info-group">
                    <div class="info-label">Pseudo</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="info-value" th:text="${session.user.username}"></div>

                        <button class="btn-edit" data-bs-toggle="modal" data-bs-target="#genericEditModal"
                            data-title="Modifier mon pseudo" data-label="Nouveau pseudo" data-field-name="newUsername"
                            th:data-current-value="${session.user.username}" data-url="/myaccount/update-username">
                            ✏️
                        </button>
                    </div>
                </div>

                <div class="info-group">
                    <div class="info-label">Mot de passe</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="info-value">******</div>
                        <button class="btn-edit" data-bs-toggle="modal" data-bs-target="#editPasswordModal"
                            title="Modifier le mot de passe">
                            ✏️
                        </button>
                    </div>
                </div>

                <div class="info-group" style="border:none;">
                    <div class="info-label">Solde Actuel</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="info-value balance-value">
                            <span th:text="${session.user.balance}"></span> Cr
                        </div>

                        <form action="/myaccount/add-balance" method="post" style="margin:0;">
                            <button type="submit" class="btn-add-credit" title="Ajouter 100 Cr au solde">
                                <span style="font-size:1.2em; line-height:1;">+</span> 100 Cr
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ONGLET 2 : STATISTIQUES -->
            <div class="tab-pane fade" id="stats" role="tabpanel">
                <h4 class="text-center mb-4" style="color:#ccc;">Évolution de vos gains</h4>
                <div class="chart-container">
                    <canvas id="balanceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="genericEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Modification</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="modalForm" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label id="modalLabel" for="modalInput" class="form-label"
                                style="color:#ccc;">Valeur</label>
                            <input type="text" class="form-control" id="modalInput" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-warning"
                            style="color:#1a1a2e; font-weight:bold;">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL SPÉCIFIQUE MOT DE PASSE -->
    <div class="modal fade" id="editPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modifier mon mot de passe</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Action vers une nouvelle route spécifique -->
                <form action="/myaccount/update-password" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label" style="color:#ccc;">Ancien mot de passe</label>
                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label" style="color:#ccc;">Nouveau mot de passe</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-warning"
                            style="color:#1a1a2e; font-weight:bold;">Modifier</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 CasYno Royal. Jouez de manière responsable.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Chart.js (inchangé) -->
    <script>
        const ctx = document.getElementById('balanceChart').getContext('2d');
        const labels = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
        const dataPoints = [0, 50, 30, 120, 80, 200, 150];

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Solde (€)',
                    data: dataPoints,
                    borderColor: '#ffd700',
                    backgroundColor: 'rgba(255, 215, 0, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#ffd700',
                    pointRadius: 5,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#ccc' } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#ccc' }, beginAtZero: true }
                }
            }
        });
    </script>
    <script>
        // Récupérer la modale dans le DOM
        var genericModal = document.getElementById('genericEditModal');

        // Ajouter un écouteur d'événement : quand la modale va s'afficher
        genericModal.addEventListener('show.bs.modal', function (event) {

            // 1. Récupérer le bouton qui a déclenché l'ouverture
            var button = event.relatedTarget;

            // 2. Extraire les infos des attributs data-* du bouton
            var title = button.getAttribute('data-title');
            var label = button.getAttribute('data-label');
            var currentValue = button.getAttribute('data-current-value');
            var url = button.getAttribute('data-url');      // L'URL du controller
            var fieldName = button.getAttribute('data-field-name'); // Le nom du paramètre (ex: newName)

            // 3. Mettre à jour le contenu de la modale
            var modalTitle = genericModal.querySelector('#modalTitle');
            var modalLabel = genericModal.querySelector('#modalLabel');
            var modalInput = genericModal.querySelector('#modalInput');
            var modalForm = genericModal.querySelector('#modalForm');

            modalTitle.textContent = title;
            modalLabel.textContent = label;
            modalInput.value = currentValue;

            // Changer l'attribut 'name' de l'input pour qu'il corresponde à ce que le Controller attend
            modalInput.setAttribute('name', fieldName);

            // Changer l'action du formulaire
            modalForm.setAttribute('action', url);
        });
    </script>
</body>

</html>
