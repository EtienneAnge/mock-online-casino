<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connexion</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,body { height:100%; }
        .login-container {
            min-height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem;
            background: linear-gradient(135deg,#f8fafc 0%, #e9eef6 100%);
        }
        .card-login {
            width:100%;
            max-width:420px;
            border-radius: .75rem;
            box-shadow: 0 6px 30px rgba(32,45,70,0.08);
        }
        .brand {
            width:64px;
            height:64px;
            border-radius: .5rem;
            background: linear-gradient(45deg,#0d6efd,#6610f2);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:700;
            font-size:22px;
            margin:auto;
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="card card-login">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="brand mb-3">CJ</div>
                    <h5 class="card-title mb-0">Connexion</h5>
                    <p class="text-muted small">Connectez-vous pour accéder à l'application</p>
                </div>

                <!-- messages : Spring Security example using thymeleaf query params (optionnel) -->
                <div th:if="${param.error}" class="alert alert-danger py-2">Identifiants invalides</div>
                <div th:if="${param.logout}" class="alert alert-success py-2">Vous avez été déconnecté</div>

                <form action="/login" method="post" class="needs-validation" novalidate>
                    <!-- si vous utilisez Spring Security avec CSRF, insérer le token ici -->
                    <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->

                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <input id="username" name="username" type="text" class="form-control" placeholder="Entrez votre nom d'utilisateur" required autofocus>
                        <div class="invalid-feedback">Veuillez renseigner votre nom d'utilisateur.</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input id="password" name="password" type="password" class="form-control" placeholder="Mot de passe" required>
                        <div class="invalid-feedback">Veuillez renseigner votre mot de passe.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input id="remember" name="remember-me" type="checkbox" class="form-check-input">
                            <label for="remember" class="form-check-label small">Se souvenir de moi</label>
                        </div>
                        <a href="/forgot-password" class="small">Mot de passe oublié ?</a>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Se connecter</button>
                    </div>
                </form>

                <div class="text-center mt-4 small text-muted">
                    Pas de compte ? <a href="/register">S'inscrire</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // simple client-side validation bootstrap
        (function () {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
